<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>PixSort</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f5;
      color: #111113;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 420px);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 0;
    }

    p {
      margin: 12px 0 0;
      color: #66666f;
      font-size: 16px;
      line-height: 1.5;
    }

    a {
      color: #111113;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>Opening PixSort</h1>
    <p id="message">Preparing your app link.</p>
  </main>

  <script>
    const APP_STORE_URL = 'https://apps.apple.com/us/app/pixsort-ai-photo-organizer/id6760485464';
    const APPSFLYER_APP_URL = 'https://app.appsflyer.com/id6760485464';
    const RESERVED_PATHS = new Set([
      'assets',
      'adley',
      'beauty.html',
      'parents.html',
      'archivist.html',
      'landing-creators.html',
      'ig-slides.html',
      'admin.html',
    ]);

    function slugFromPath(pathname) {
      const parts = pathname.split('/').filter(Boolean);
      if (parts.length !== 1) return null;
      const slug = parts[0].trim().toLowerCase();
      if (RESERVED_PATHS.has(slug)) return null;
      if (!/^[a-z0-9][a-z0-9-]{0,47}$/.test(slug)) return null;
      return slug;
    }

    function buildAffiliateUrl(slug) {
      const now = new Date();
      const campaign = `${slug}-${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      const clickId = `pixsort-app-${slug}`;
      const publicUrl = `https://pixsort.app/${encodeURIComponent(slug)}/`;
      const fallback = new URL(`sortscout://collab/${encodeURIComponent(slug)}`);
      fallback.searchParams.set('utm_source', slug);
      fallback.searchParams.set('utm_medium', 'influencer');
      fallback.searchParams.set('utm_campaign', campaign);
      fallback.searchParams.set('click_id', clickId);

      const url = new URL(APPSFLYER_APP_URL);
      url.searchParams.set('pid', slug);
      url.searchParams.set('c', campaign);
      url.searchParams.set('af_channel', 'influencer');
      url.searchParams.set('af_adset', `${slug}-landing`);
      url.searchParams.set('af_ad', `${slug}-public-link`);
      url.searchParams.set('af_siteid', slug);
      url.searchParams.set('af_sub1', slug);
      url.searchParams.set('af_sub2', campaign);
      url.searchParams.set('af_sub3', clickId);
      url.searchParams.set('deep_link_value', 'collab');
      url.searchParams.set('deep_link_sub1', slug);
      url.searchParams.set('deep_link_sub2', campaign);
      url.searchParams.set('deep_link_sub3', clickId);
      url.searchParams.set('af_dp', fallback.toString());
      url.searchParams.set('af_ios_url', APP_STORE_URL);
      url.searchParams.set('af_web_dp', publicUrl);
      url.searchParams.set('af_click_lookback', '30d');
      return url.toString();
    }

    const slug = slugFromPath(window.location.pathname);
    if (slug) {
      window.location.replace(buildAffiliateUrl(slug));
    } else {
      document.title = 'Page not found - PixSort';
      document.querySelector('h1').textContent = 'Page not found';
      document.getElementById('message').innerHTML = 'Go back to <a href="/">pixsort.app</a>.';
    }
  </script>
</body>
</html>
