<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>PixSort</title>
<link rel="manifest" href="/manifest_app_v1.json" />
<meta name="theme-color" content="#000000" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="PixSort" />
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
<style>
  :root{
    --cream:#efe7da; --card:#fbf7ef; --gold:#bfa05c; --gold-d:#a98a47;
    --ink:#2b2926; --ink-dim:#8d877a; --ink-faint:#b3ac9d; --line:#e7ded0;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:#000;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;}

  .app{position:fixed;inset:0;background:var(--cream);color:var(--ink);
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);display:flex;flex-direction:column;}

  .status{flex:0 0 auto;height:46px;display:flex;align-items:center;justify-content:space-between;
    padding:14px 26px 0;font-size:14px;font-weight:600;}
  .status .right{display:flex;align-items:center;gap:6px;font-size:12px;}
  .batt{border:1.4px solid var(--ink);border-radius:3px;width:22px;height:11px;position:relative;display:inline-block;}
  .batt::after{content:"";position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:78%;background:var(--ink);border-radius:1px;}
  .batt::before{content:"";position:absolute;right:-3px;top:3px;height:5px;width:2px;background:var(--ink);border-radius:1px;}

  .head{flex:0 0 auto;padding:8px 20px 12px;}
  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:800;}
  .head h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:3px;display:flex;align-items:center;gap:8px;}
  .head .sub{font-size:13px;color:var(--ink-dim);margin-top:4px;}
  .head .sub b{color:var(--gold-d);font-weight:700;}

  .grid{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
    display:grid;grid-template-columns:1fr 1fr;gap:13px;padding:4px 18px 24px;align-content:start;}
  .card{border-radius:16px;overflow:hidden;background:var(--card);box-shadow:0 6px 16px rgba(120,100,60,.09);}
  .card .thumb{height:104px;background:#ddd center/cover;position:relative;}
  .card .thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.18));}
  .card .meta{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;}
  .card .nm{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:6px;letter-spacing:-.01em;}
  .card .ct{font-size:12px;color:var(--ink-faint);font-weight:600;}
  .card.flag .nm{color:#b23a48;}

  .tabbar{flex:0 0 auto;height:58px;background:rgba(250,247,239,.95);border-top:1px solid var(--line);
    display:flex;justify-content:space-around;align-items:flex-start;padding-top:9px;}
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;color:var(--ink-faint);}
  .tab.active{color:var(--gold);}
  .tab .gi{font-size:16px;line-height:1;}
</style>
</head>
<body>
  <div class="app">
    <div class="status">
      <span>9:41</span>
      <span class="right">•••&nbsp; <svg width="16" height="11" viewBox="0 0 16 11"><path d="M8 1C5 1 2.6 2 1 3.6l7 6.4 7-6.4C13.4 2 11 1 8 1Z" fill="#2b2926" opacity=".9"/></svg> <span class="batt"></span></span>
    </div>

    <div class="head">
      <div class="eyebrow">🕵️‍♀️ Sorted just now</div>
      <h1>Collections</h1>
      <div class="sub"><b>676 items</b> pulled from your camera roll · 8 albums</div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="tabbar">
      <div class="tab active"><span class="gi">▦</span>Albums</div>
      <div class="tab"><span class="gi">⌕</span>Search</div>
      <div class="tab"><span class="gi">✦</span>Clean Up</div>
      <div class="tab"><span class="gi">⚙</span>Settings</div>
    </div>
  </div>

<script>
const T="assets/tiff-roll/";
// evidence albums (flag=true tints the name red for the "gotcha" ones)
const ALB=[
  {n:"Screenshots", c:247, ic:"📱", cv:"crop_ss_r1c1.jpg"},
  {n:"DMs",         c:134, ic:"💬", cv:"crop_ss_r1c2.jpg", flag:true},
  {n:"Late Nights", c:92,  ic:"🌙", cv:"crop_sunset_r2c1.jpg", flag:true},
  {n:"Call Log",    c:67,  ic:"📞", cv:"crop_ss_r2c1.jpg"},
  {n:"Locations",   c:58,  ic:"📍", cv:"crop_travel5_r1c3.jpg"},
  {n:"Receipts",    c:41,  ic:"🧾", cv:"crop_ss_r1c2.jpg"},
  {n:"Her",         c:23,  ic:"👀", cv:"crop_gym_r3c1.jpg", flag:true},
  {n:"Hotels",      c:14,  ic:"🏨", cv:"crop_travel5_r2c2.jpg", flag:true},
];
document.getElementById('grid').innerHTML = ALB.map(a=>`
  <div class="card${a.flag?' flag':''}">
    <div class="thumb" style="background-image:url('${T+a.cv}')"></div>
    <div class="meta"><span class="nm">${a.ic} ${a.n}</span><span class="ct">${a.c}</span></div>
  </div>`).join('');
</script>
</body>
</html>
