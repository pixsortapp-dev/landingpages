<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>PixSort</title>
<meta name="theme-color" content="#000000" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="PixSort" />
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
<style>
  :root{
    --cream:#efe7da; --card:#fbf7ef; --gold:#bfa05c; --gold-d:#a98a47;
    --ink:#2b2926; --ink-dim:#8d877a; --ink-faint:#b3ac9d; --line:#e7ded0;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:var(--cream);overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;}
  .app{position:fixed;inset:0;background:var(--cream);color:var(--ink);
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    display:flex;flex-direction:column;}

  .sb{display:none !important;}
  .sb .time{font-size:16px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
  .sb .r{display:flex;align-items:center;gap:7px;padding-right:14px;}
  .sig{display:flex;align-items:flex-end;gap:1.5px;height:11px;}
  .sig i{width:3px;border-radius:1px;background:var(--ink);display:block;}
  .sig i:nth-child(1){height:4px;} .sig i:nth-child(2){height:6px;}
  .sig i:nth-child(3){height:8.5px;} .sig i:nth-child(4){height:11px;}
  .battp{position:relative;width:27px;height:13px;border-radius:4px;background:rgba(43,41,38,.28);
    display:flex;align-items:center;justify-content:center;}
  .battp::after{content:"";position:absolute;right:-3.5px;top:4px;height:5px;width:2px;
    background:rgba(43,41,38,.35);border-radius:0 2px 2px 0;}
  .battp b{font-size:10.5px;font-weight:700;color:var(--ink);letter-spacing:-.02em;line-height:1;}

  /* header: brand + big counter */
  .head{flex:0 0 auto;text-align:center;padding:20px 24px 4px;}
  .brand{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:800;letter-spacing:-.01em;}
  .brand img{width:24px;height:24px;border-radius:7px;}
  .stateline{margin-top:10px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--gold-d);font-weight:700;min-height:17px;}
  .stateline .dots::after{content:"";animation:d 1.2s steps(4) infinite;}
  @keyframes d{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
  /* live scanner: photo card flipping under a scan line */
  .scanner{position:relative;width:96px;height:96px;margin:8px auto 0;}
  .scanner .flip{position:absolute;inset:6px;border-radius:16px;background:#ddd center/cover;
    border:3px solid #fff;box-shadow:0 10px 26px rgba(0,0,0,.18);}
  .scanner .line{position:absolute;left:2px;right:2px;height:3px;border-radius:2px;z-index:3;
    background:linear-gradient(90deg,transparent,var(--gold) 18%,#ffe9b8 50%,var(--gold) 82%,transparent);
    box-shadow:0 0 14px rgba(191,160,92,.75);animation:sweep 1.15s ease-in-out infinite alternate;}
  @keyframes sweep{from{top:6px;}to{top:calc(100% - 9px);}}
  .scanner .br{position:absolute;width:20px;height:20px;border:3px solid var(--gold-d);z-index:2;}
  .scanner .br.tl{top:-3px;left:-3px;border-right:none;border-bottom:none;border-radius:7px 0 0 0;}
  .scanner .br.tr{top:-3px;right:-3px;border-left:none;border-bottom:none;border-radius:0 7px 0 0;}
  .scanner .br.bl{bottom:-3px;left:-3px;border-right:none;border-top:none;border-radius:0 0 0 7px;}
  .scanner .br.br2{bottom:-3px;right:-3px;border-left:none;border-top:none;border-radius:0 0 7px 0;}

  .bignum{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin-top:8px;
    font-variant-numeric:tabular-nums;}
  .bignum small{font-size:15px;font-weight:600;color:var(--ink-dim);letter-spacing:0;margin-left:5px;}

  /* scan shimmer bar */
  .scanbar{margin:9px auto 0;width:210px;height:6px;border-radius:5px;background:#e4dccb;overflow:hidden;position:relative;}
  .scanbar i{position:absolute;inset:0;border-radius:5px;background:var(--gold);width:0;}
  .scanbar::after{content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
    transform:translateX(-100%);animation:sheen 1.4s ease-in-out infinite;}
  @keyframes sheen{to{transform:translateX(100%);}}
  .divider{width:56px;height:1.5px;background:var(--line);margin:13px auto 0;}

  /* discovery feed */
  .feed{flex:1 1 auto;overflow-y:auto;scrollbar-width:none;padding:9px 24px 4px;
    display:flex;flex-direction:column;gap:7px;}
  .feed::-webkit-scrollbar{display:none;}
  .row{flex:0 0 auto;}
  .row{display:none;align-items:center;gap:11px;background:var(--card);border-radius:14px;padding:7px 12px;
    box-shadow:0 6px 16px rgba(120,100,60,.08);
    opacity:0;transform:translateY(14px) scale(.94);}
  .row.in{display:flex;animation:land .5s cubic-bezier(.2,.9,.3,1.25) forwards;}
  @keyframes land{60%{opacity:1;transform:translateY(-3px) scale(1.02);}100%{opacity:1;transform:none;}}
  .row .th{width:37px;height:37px;border-radius:11px;background:#ddd center/cover;flex:0 0 auto;
    border:1.5px solid #fff;box-shadow:0 3px 9px rgba(0,0,0,.14);}
  .row .tx{flex:1;}
  .row .t1{font-size:15px;font-weight:700;letter-spacing:-.01em;}
  .row .t1 .sp{margin-right:5px;}
  .row .t2{font-size:12px;color:var(--ink-dim);font-weight:600;margin-top:1px;font-variant-numeric:tabular-nums;}
  .row .chk{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--gold);
    display:flex;align-items:center;justify-content:center;transform:scale(0);}
  .row.in .chk{animation:pop .35s cubic-bezier(.2,.9,.3,1.4) .18s forwards;}
  @keyframes pop{to{transform:scale(1);}}
  .row .chk svg{width:13px;height:13px;}
  .row .chk path{stroke:#fff;stroke-width:9;fill:none;stroke-linecap:round;stroke-linejoin:round;}

  /* done state */
  .done{flex:0 0 auto;text-align:center;padding:2px 24px calc(14px + env(safe-area-inset-bottom));
    opacity:0;transform:translateY(10px);}
  .done.in{animation:land .5s cubic-bezier(.2,.9,.3,1.25) forwards;}
  .done .word{font-size:26px;font-weight:800;letter-spacing:-.02em;}
  .done .sum{font-size:13.5px;color:var(--ink-dim);font-weight:600;margin-top:3px;}
</style>
</head>
<body>
  <div class="app" id="app">
    <div class="sb">
      <span class="time">11:56</span>
      <span class="r">
        <span class="sig"><i></i><i></i><i></i><i></i></span>
        <svg width="17" height="12" viewBox="0 0 17 12" aria-hidden="true"><path d="M8.5 2.4c2.2 0 4.2.8 5.8 2.2.2.15.48.14.66-.04l1-1a.46.46 0 0 0-.02-.68A11.4 11.4 0 0 0 8.5 0C5.65 0 3.05 1.05 1.06 2.88a.46.46 0 0 0-.02.68l1 1c.18.18.46.19.66.04A8.9 8.9 0 0 1 8.5 2.4Zm0 3.9c1.2 0 2.3.44 3.15 1.17.2.16.48.15.66-.03l1-1a.46.46 0 0 0-.03-.69A7.5 7.5 0 0 0 8.5 4.05c-1.8 0-3.45.63-4.78 1.7a.46.46 0 0 0-.03.69l1 1c.18.18.47.19.66.03A4.9 4.9 0 0 1 8.5 6.3Zm2.1 3.06a.47.47 0 0 0 0-.72 3.4 3.4 0 0 0-4.2 0 .47.47 0 0 0 0 .72l1.77 1.77c.18.18.48.18.66 0l1.77-1.77Z" fill="#2b2926"/></svg>
        <span class="battp"><b>95</b></span>
      </span>
    </div>

    <div class="head">
      <div class="brand"><img src="assets/pixsort-icon.jpeg" alt="">PixSort</div>
      <div class="stateline" id="stateline"><span id="stateTxt">Scanning</span><span class="dots"></span></div>
      <div class="scanner">
        <div class="br tl"></div><div class="br tr"></div><div class="br bl"></div><div class="br br2"></div>
        <div class="flip" id="flip"></div>
        <div class="line"></div>
      </div>
      <div class="bignum"><span id="bignum">0</span><small>photos</small></div>
      <div class="scanbar"><i id="scanfill"></i></div>
    </div>

    <div class="feed" id="feed"></div>

    <div class="done" id="done">
      <div class="word">Done.</div>
      <div class="sum" id="doneSum"></div>
    </div>
  </div>

<script>
/* ================= CONCEPT REGISTRY =================
   One page, many use cases. Pick with ?c=<name> in the URL
   (e.g. pixsort_app_scan.html?c=evidence). Default: standard.
   Add a concept = add an entry. Creator packs = swap tile paths. */
const CONCEPTS = {
  standard: {
    total: 18432, albums: 16,
    states: ["Scanning","Finding people","Finding places","Finding food","Finding moments"],
    discoveries: [
      {label:"Dogs",        count:382, tile:"assets/template/dogs-1.svg"},
      {label:"Beaches",     count:91,  tile:"assets/travel/hawaii.jpg"},
      {label:"Hotels",      count:56,  tile:"assets/template/hotels-1.svg"},
      {label:"Restaurants", count:247, tile:"assets/template/restaurants-1.svg"},
      {label:"Receipts",    count:63,  tile:"assets/template/receipts-1.svg"},
      {label:"Sunsets",     count:129, tile:"assets/template/sunset-1.svg"},
      {label:"Japan",       count:312, tile:"assets/travel/japan.jpg"},
      {label:"France",      count:248, tile:"assets/travel/paris.jpg"},
    ],
  },
  countries: {
    total: 18432, albums: 10,
    states: ["Scanning","Reading locations","Grouping by country","Finding trips"],
    discoveries: [
      {label:"Japan",     count:312, tile:"assets/travel/japan.jpg"},
      {label:"France",    count:248, tile:"assets/travel/paris.jpg"},
      {label:"Bali",      count:206, tile:"assets/travel/bali.jpg"},
      {label:"Thailand",  count:184, tile:"assets/travel/thailand.jpg"},
      {label:"Peru",      count:143, tile:"assets/travel/peru.jpg"},
      {label:"Australia", count:97,  tile:"assets/travel/sydney.jpg"},
      {label:"Taiwan",    count:88,  tile:"assets/travel/taiwan.jpg"},
      {label:"Hawaii",    count:76,  tile:"assets/travel/hawaii.jpg"},
    ],
  },
  gym: {
    total: 9840, albums: 7,
    states: ["Scanning","Finding workouts","Finding progress","Finding meals"],
    discoveries: [
      {label:"Progress Pics",  count:284, tile:"assets/gym/progress.jpg"},
      {label:"Mirror Selfies", count:212, tile:"assets/gym/mirror.jpg"},
      {label:"Back Day",       count:143, tile:"assets/gym/back.jpg"},
      {label:"Leg Day",        count:128, tile:"assets/gym/glutes.jpg"},
      {label:"Arms",           count:96,  tile:"assets/gym/arms.jpg"},
      {label:"Meals",          count:174, tile:"assets/gym/meals.jpg"},
      {label:"Weigh-Ins",      count:67,  tile:"assets/gym/weight.jpg"},
    ],
  },
  evidence: {
    total: 2431, albums: 8,
    states: ["Scanning","Finding screenshots","Finding places","Finding people"],
    discoveries: [
      {label:"Screenshots", count:247, tile:"assets/evidence/screenshots.jpg"},
      {label:"DMs",         count:134, tile:"assets/evidence/dms.jpg"},
      {label:"Late Nights", count:92,  tile:"assets/evidence/late-nights.jpg"},
      {label:"Call Logs",   count:67,  tile:"assets/evidence/call-log.jpg"},
      {label:"Locations",   count:58,  tile:"assets/evidence/locations.jpg"},
      {label:"Receipts",    count:41,  tile:"assets/evidence/receipts.jpg"},
      {label:"Her",         count:23,  tile:"assets/evidence/her.jpg"},
      {label:"Hotels",      count:14,  tile:"assets/evidence/hotels.jpg"},
    ],
  },
  family: {
    total: 27480, albums: 6,
    states: ["Scanning","Finding faces","Finding holidays","Finding milestones"],
    discoveries: [
      {label:"Birthdays",   count:412, tile:"assets/family/birthdays.jpg"},
      {label:"Christmas",   count:386, tile:"assets/family/christmas.jpg"},
      {label:"Vacation",    count:274, tile:"assets/family/vacation.jpg"},
      {label:"Halloween",   count:168, tile:"assets/family/halloween.jpg"},
      {label:"First Day",   count:94,  tile:"assets/family/first-day.jpg"},
      {label:"First Steps", count:61,  tile:"assets/family/first-steps.jpg"},
    ],
  },
  lauren: {
    total: 14208, albums: 6,
    states: ["Scanning","Finding footage","Finding product shots","Finding assets"],
    discoveries: [
      {label:"Screenshots",   count:1204, tile:"assets/lauren/screenshots.jpg"},
      {label:"B-Roll",        count:528,  tile:"assets/lauren/broll.jpg"},
      {label:"Talking Heads", count:342,  tile:"assets/lauren/talking-heads.jpg"},
      {label:"Product Shots", count:214,  tile:"assets/lauren/product.jpg"},
      {label:"Assets",        count:173,  tile:"assets/lauren/assets.jpg"},
      {label:"Receipts",      count:86,   tile:"assets/lauren/receipts.jpg"},
    ],
  },
  calledout: {
    total: 14208, albums: 10,
    states: ["Scanning","Finding habits","Finding patterns","Judging you"],
    discoveries: [
      {label:"Screenshots You Never Opened", count:1204, tile:"assets/template/screenshots-1.svg"},
      {label:"Food You Photographed First",  count:462,  tile:"assets/template/food-1.svg"},
      {label:"Gym Check-Ins",                count:87,   tile:"assets/template/fitness-1.svg"},
      {label:"The Same Selfie",              count:212,  tile:"assets/template/selfie-1.svg"},
      {label:"Sunsets You Never Posted",     count:143,  tile:"assets/template/sunset-1.svg"},
      {label:"Receipts",                     count:319,  tile:"assets/template/receipts-1.svg"},
    ],
  },
};
const CONCEPT = CONCEPTS[new URLSearchParams(location.search).get('c')] || CONCEPTS.standard;
const TOTAL_PHOTOS = CONCEPT.total;
const ALBUM_COUNT  = CONCEPT.albums;
const SCAN_STATES  = CONCEPT.states;
const DISCOVERIES  = CONCEPT.discoveries;
/* ==================================================== */

/* pool of images the scanner flips through (creator versions: swap for real photos) */
const SCAN_POOL=["travel","food","fitness","selfie","screenshots","sunset"]
  .flatMap(c=>[1,2,3].map(v=>`assets/template/${c}-${v}.svg`))
  .concat(DISCOVERIES.map(d=>d.tile));

const $=id=>document.getElementById(id);
const feed=$('feed');

// build rows (hidden until their moment)
feed.innerHTML=DISCOVERIES.map(d=>`
  <div class="row">
    <div class="th" style="background-image:url('${d.tile}')"></div>
    <div class="tx">
      <div class="t1"><span class="sp">✨</span>Found ${d.label}</div>
      <div class="t2"><b class="cnt">0</b> photos</div>
    </div>
    <div class="chk"><svg viewBox="0 0 50 50"><path d="M13 26l8 8 16-17"/></svg></div>
  </div>`).join('');
const rows=[...feed.children];

let timers=[],rafs=[],flipTimer=null;
const t=(fn,ms)=>timers.push(setTimeout(fn,ms));
function countUp(el,target,dur,fmt){
  const start=performance.now();
  (function step(now){
    const p=Math.min(1,(now-start)/dur), e=1-Math.pow(1-p,3);
    el.textContent=fmt(Math.round(e*target));
    if(p<1) rafs.push(requestAnimationFrame(step));
  })(start);
}

function play(){
  timers.forEach(clearTimeout);timers=[];rafs.forEach(cancelAnimationFrame);rafs=[];
  clearInterval(flipTimer);
  rows.forEach(r=>{r.classList.remove('in');r.querySelector('.cnt').textContent='0';});
  feed.scrollTop=0;
  $('done').classList.remove('in');
  $('scanfill').style.transition='none';$('scanfill').style.width='0';
  $('stateTxt').textContent=SCAN_STATES[0];
  $('stateline').style.opacity='1';

  const ROW_GAP=500;               // ms between discoveries
  const SCAN_LEAD=250;             // scanning beat before first find
  const TOTAL_DUR=SCAN_LEAD+DISCOVERIES.length*ROW_GAP+600;

  // scanner card flips through photos the whole time (the "AI looking" visual)
  let k=Math.floor(Math.random()*SCAN_POOL.length), hold=0;
  $('flip').style.backgroundImage=`url('${SCAN_POOL[k]}')`;
  flipTimer=setInterval(()=>{
    if(hold>0){hold--;return;}                 // pause on a found tile for a beat
    k=(k+1)%SCAN_POOL.length;
    $('flip').style.backgroundImage=`url('${SCAN_POOL[k]}')`;
  },90);

  // big counter + progress fill run across the whole scan
  countUp($('bignum'),TOTAL_PHOTOS,TOTAL_DUR,n=>n.toLocaleString());
  requestAnimationFrame(()=>{ $('scanfill').style.transition=`width ${TOTAL_DUR}ms linear`; $('scanfill').style.width='100%'; });

  // rotate the scanning state line
  SCAN_STATES.forEach((s,i)=>t(()=>{$('stateTxt').textContent=s;}, i*Math.floor(TOTAL_DUR/SCAN_STATES.length)));

  // discoveries land one by one; the scanner locks onto the found tile for a beat
  DISCOVERIES.forEach((d,i)=>t(()=>{
    $('flip').style.backgroundImage=`url('${d.tile}')`; hold=5;
    const r=rows[i];
    r.classList.add('in');
    countUp(r.querySelector('.cnt'),d.count,650,n=>n.toLocaleString());
    const fr=feed.getBoundingClientRect(), rr=r.getBoundingClientRect();
    if(rr.bottom>fr.bottom) feed.scrollTop += (rr.bottom-fr.bottom)+8;  // reveal, don't overshoot
  }, SCAN_LEAD+i*ROW_GAP));

  // done — scanner stops on the last find
  t(()=>{
    clearInterval(flipTimer);
    $('stateline').style.opacity='0';
    $('doneSum').textContent=TOTAL_PHOTOS.toLocaleString()+" photos → "+ALBUM_COUNT+" albums";
    $('done').classList.add('in');
  }, TOTAL_DUR);
}

$('app').addEventListener('click',play);
play();
</script>
</body>
</html>
