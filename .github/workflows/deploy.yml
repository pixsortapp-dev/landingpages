name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '_pixsort-affiliate-rate-limits/**'
      - '_pixsort-affiliate-slug-reservations/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A later push can cancel this run. Always deploy the newest complete
          # branch state, even when GitHub delivers adjacent push events out of order.
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
        id: deployment
